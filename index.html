<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide-react@0.292.0/dist/umd/lucide-react.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; }
        .metal-shadow { box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { Users, Image: ImageIcon, Menu, Plus } = lucideReact;

        const GROUPS = [
            { id: 'cantante', label: 'Cantante', emoji: '🎤', gradient: 'linear-gradient(135deg, #60a5fa 0%, #3b82f6 40%, #1d4ed8 60%, #1e3a8a 100%)' },
            { id: 'actriz', label: 'Actriz', emoji: '🎬', gradient: 'linear-gradient(135deg, #4ade80 0%, #22c55e 40%, #15803d 60%, #14532d 100%)' },
            { id: 'nsfw', label: 'NSFW', emoji: '🔥', gradient: 'linear-gradient(135deg, #f87171 0%, #ef4444 40%, #b91c1c 60%, #7f1d1d 100%)' },
            { id: 'otro', label: 'Otro', emoji: '💋', gradient: 'linear-gradient(135deg, #fde047 0%, #eab308 40%, #a16207 60%, #713f12 100%)' },
        ];

        const MetallicButton = ({ children, onClick, colorType = 'dark', className = '' }) => {
            const getColors = () => {
                switch(colorType) {
                    case 'blue': return 'from-blue-400 via-blue-600 to-blue-800';
                    case 'dark': default: return 'from-gray-500 via-gray-700 to-gray-900';
                }
            };
            return (
                <button onClick={onClick} className={`bg-gradient-to-b ${getColors()} text-white p-4 rounded-xl metal-shadow active:translate-y-[2px] transition-all font-bold ${className}`}>
                    {children}
                </button>
            );
        };

        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            
            return (
                <div className="flex flex-col h-screen w-full overflow-hidden">
                    <header className="h-16 flex items-center justify-between px-4 bg-[#1a1a1a] border-b border-gray-800">
                        <h1 className="text-xl font-black bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Nexus Gallery</h1>
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="p-2"><Menu className="w-8 h-8" /></button>
                    </header>
                    
                    {isMenuOpen && (
                        <nav className="absolute top-16 left-0 w-full bg-[#1a1a1a] p-4 flex flex-col gap-4 z-40">
                            <MetallicButton colorType="dark" onClick={() => setIsMenuOpen(false)}>Personajes</MetallicButton>
                            <MetallicButton colorType="dark" onClick={() => setIsMenuOpen(false)}>Galería</MetallicButton>
                        </nav>
                    )}

                    <main className="flex-1 overflow-y-auto p-4">
                        <div className="grid grid-cols-2 gap-4">
                            {GROUPS.map(g => (
                                <div key={g.id} className="h-40 rounded-2xl flex flex-col items-center justify-center shadow-lg" style={{ background: g.gradient }}>
                                    <span className="text-4xl">{g.emoji}</span>
                                    <span className="font-black text-sm mt-2">{g.label}</span>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
